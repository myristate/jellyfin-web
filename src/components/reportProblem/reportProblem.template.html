<div class="formDialogHeader">
    <button is="paper-icon-button-light" class="btnCancel autoSize" tabindex="-1" title="${ButtonBack}">
        <span class="material-icons arrow_back" aria-hidden="true"></span>
    </button>

    <h3 class="formDialogHeaderTitle">${ReportProblem}</h3>
</div>

<div class="formDialogContent smoothScrollY">
    <div class="dialogContentInner dialog-content-centered" style="padding-top:2em;">
        <form>
            <p class="reportProblemItemName"></p>

            <div class="selectContainer">
                <select is="emby-select" id="selectProblem" label="${LabelReportProblem}">
                    <option value="Video">${ReportProblemVideo}</option>
                    <option value="Audio">${ReportProblemAudio}</option>
                    <option value="WrongLanguage">${ReportProblemWrongLanguage}</option>
                    <option value="Subtitles">${ReportProblemSubtitles}</option>
                    <option value="Other">${ReportProblemOther}</option>
                </select>
            </div>

            <div class="inputContainer">
                <textarea is="emby-textarea" id="txtReportNote" label="${LabelReportNote}" rows="3" maxlength="1000"></textarea>
                <div class="fieldDescription">${ReportNoteHelp}</div>
            </div>

            <div class="formDialogFooter">
                <button is="emby-button" type="submit" class="raised btnSubmit block formDialogFooterItem button-submit">
                    <span>${ButtonSendReport}</span>
                </button>
            </div>
        </form>
    </div>
</div>
