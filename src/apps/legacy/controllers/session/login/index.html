<div id="loginPage" data-role="page" class="page standalonePage backdropPage" data-backbutton="false" data-backdroptype="splashscreen">
    <div class="padded-left padded-right padded-bottom-page margin-auto-y">
        <form class="manualLoginForm margin-auto-x hide">
            <div class="padded-left padded-right flex align-items-center justify-content-center">
                <h1 class="sectionTitle">${HeaderPleaseSignIn}</h1>
            </div>
            <div class="inputContainer">
                <input is="emby-input" type="text" id="txtManualName" required="required" label="${LabelUser}" autocomplete="username" autocapitalize="off" />
            </div>

            <div class="inputContainer">
                <input is="emby-input" id="txtManualPassword" type="password" label="${LabelPassword}" autocomplete="current-password" />
            </div>

            <label class="checkboxContainer">
                <input is="emby-checkbox" type="checkbox" class="chkRememberLogin" checked />
                <span>${RememberMe}</span>
            </label>

            <button is="emby-button" type="submit" class="raised button-submit block">
                <span>${ButtonSignIn}</span>
            </button>

            <div style="margin-top:.5em;">
                <button is="emby-button" type="button" class="raised cancel block btnCancel">
                    <span>${ButtonCancel}</span>
                </button>
            </div>
        </form>

        <form class="pinLoginForm margin-auto-x hide">
            <h1 class="sectionTitle pinTitle"></h1>
            <input id="txtPin" class="pinInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" aria-label="${LabelPin}" />
            <div class="pinPad">
                <button is="emby-button" type="button" class="raised pinKey" data-digit="1">1</button>
                <button is="emby-button" type="button" class="raised pinKey" data-digit="2">2</button>
                <button is="emby-button" type="button" class="raised pinKey" data-digit="3">3</button>
                <button is="emby-button" type="button" class="raised pinKey" data-digit="4">4</button>
                <button is="emby-button" type="button" class="raised pinKey" data-digit="5">5</button>
                <button is="emby-button" type="button" class="raised pinKey" data-digit="6">6</button>
                <button is="emby-button" type="button" class="raised pinKey" data-digit="7">7</button>
                <button is="emby-button" type="button" class="raised pinKey" data-digit="8">8</button>
                <button is="emby-button" type="button" class="raised pinKey" data-digit="9">9</button>
                <span></span>
                <button is="emby-button" type="button" class="raised pinKey" data-digit="0">0</button>
                <button is="emby-button" type="button" class="raised pinKey pinDelete" title="${Delete}"><span class="material-icons backspace" aria-hidden="true"></span></button>
            </div>
            <button is="emby-button" type="button" class="raised cancel block btnUsePassword hide">
                <span>${ButtonUsePassword}</span>
            </button>
            <button is="emby-button" type="button" class="raised cancel block btnPinCancel">
                <span>${ButtonCancel}</span>
            </button>
        </form>

        <div class="visualLoginForm" style="text-align: center;">
            <h1 style="margin-top:1em;">${HeaderPleaseSignIn}</h1>
            <div id="divUsers" class="itemsContainer vertical-wrap centered"></div>
        </div>

        <div class="readOnlyContent" style="margin: .5em auto 1em;">
            <button is="emby-button" type="button" class="raised cancel block btnManual">
                <span>${ButtonManualLogin}</span>
            </button>

            <button is="emby-button" type="button" class="raised cancel block btnQuick hide">
                <span>${ButtonUseQuickConnect}</span>
            </button>

            <button is="emby-button" type="button" class="raised cancel block btnForgotPassword">
                <span>${ButtonForgotPassword}</span>
            </button>

            <button is="emby-button" type="button" class="raised block btnSelectServer">
                <span>${ButtonChangeServer}</span>
            </button>

            <div class="loginDisclaimerContainer">
                <div class="loginDisclaimer"></div>
            </div>
        </div>
    </div>
</div>
